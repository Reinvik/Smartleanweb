<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1e" />
    <link rel="manifest" href="/manifest.json" />
    <title>SmartLean | Transformación Operacional Industry 5.0</title>
    <meta name="description" content="SmartLean: Consultoría y Metodología Propietaria para la Transformación Digital Industrial. Lean Excellence, Cloud Data, and AI Agents." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }

      // Fail-safe: Detect broken asset loads and clear cache
      window.addEventListener('error', (e) => {
        if (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') {
          console.warn('Asset failed to load. Clearing SW and reloading...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (let registration of registrations) {
                registration.unregister();
              }
              window.location.reload(true);
            });
          }
        }
      }, true);
    </script>
  </body>
</html>
